name: AI Code Review

on:
  pull_request:
    branches: [main, developer]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: write
  # models: read  # não é necessário ainda

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install openai @octokit/rest

      - name: Run AI Review
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }} # seu PAT
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # token automático para comentar no PR
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: node .github/scripts/ai-review.js
